version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_app
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aplis
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql

  backendjs:
    build: ./backendjs
    container_name: backendjs
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    environment:
      PORT_SERVER: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: aplis

  backendphp:
    build: ./backendphp
    container_name: backendphp
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - mysql

  app:
    build: ./app
    container_name: app
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backendjs
      - backendphp
    environment:
      VITE_API_PATIENTS_URL: http://localhost:3001/api/v1
      VITE_API_DOCTORS_URL: http://localhost:8000/api/v1

volumes:
  mysql_data: